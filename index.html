<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap');

    :root {
      --bg-color: #050a15;
      --panel-bg: rgba(10, 20, 40, 0.7);
      --border-color: rgba(0, 255, 255, 0.2);
      --border-glow: rgba(0, 255, 255, 0.5);
      --text-main: #e0f2fe;
      --accent-1: #00ffff;
      --accent-3: #00ffaa;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 30px 30px; }
    }
    @keyframes scanLine {
      0% { transform: translateY(-100%); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.3; box-shadow: 0 0 2px currentColor; }
      50% { opacity: 1; box-shadow: 0 0 10px currentColor; }
    }
    @keyframes borderGlow {
      0%, 100% { border-color: rgba(255, 255, 255, 0.1); box-shadow: none; }
      50% { border-color: var(--card-color); box-shadow: 0 0 15px var(--card-color), inset 0 0 10px rgba(0, 0, 0, 0.5); }
    }
    @keyframes countPulse {
      0%, 100% { opacity: 0.8; text-shadow: 0 0 5px currentColor; }
      50% { opacity: 1; text-shadow: 0 0 15px currentColor; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: var(--font-body); min-height: 100vh; overflow-x: hidden;
      background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px; padding: 1.5rem;
      animation: gridMove 5s linear infinite;
    }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 0%, var(--bg-color) 100%);
      pointer-events: none; z-index: -1;
    }
    .scanner {
      position: fixed; top: 0; left: 0; width: 100vw; height: 3px;
      background: var(--accent-1); box-shadow: 0 0 15px var(--accent-1);
      animation: scanLine 6s linear infinite; z-index: 1000; pointer-events: none;
    }
    header { text-align: center; margin-bottom: 2rem; position: relative; }
    h1 { font-family: var(--font-heading); font-size: 2.5rem; color: var(--accent-1); text-transform: uppercase; letter-spacing: 0.2em; text-shadow: 0 0 10px var(--accent-1), 0 0 20px var(--accent-1); margin-bottom: 0.5rem; }
    .subtitle { font-family: var(--font-mono); font-size: 1.1rem; color: var(--accent-3); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }
    
    
    
    
    
    .dashboard {
      width: 100%;
      height: 75vh;
      min-height: 600px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: hidden;
    }
    .carousel-track {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .category-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2.5rem;
      position: absolute;
      width: 400px;
      height: 550px;
      max-height: 80vh;
      overflow-y: auto;
      transition: border-color 0.3s, box-shadow 0.3s;
      cursor: pointer;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .category-card::-webkit-scrollbar {
      display: none;
    }
    .category-card:hover {
      border-color: var(--card-color);
      box-shadow: 0 10px 30px -10px var(--card-color);
    }

    
    
    
    
    



    
    .category-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;
    }
    .category-title { font-family: var(--font-heading); font-size: 1.3rem; color: var(--card-color); letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--card-color); margin-right: 0.6rem; animation: dotBlink 2s ease-in-out infinite; }
    .skill-count { font-family: var(--font-mono); font-size: 1.1rem; background: rgba(0, 0, 0, 0.2); color: var(--card-color); padding: 0.2rem 0.8rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); animation: countPulse 3s ease-in-out infinite; }
    
    .skills-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem; flex-grow: 1; align-content: start;
    }
    .skill-badge {
      font-family: var(--font-mono); font-size: 0.9rem; background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.5rem; border-radius: 4px;
      text-align: center; transition: all 0.2s; position: relative; overflow: hidden;
      word-break: break-word; line-height: 1.2;
    }
    .skill-badge:hover { border-color: var(--card-color); color: var(--card-color); background: rgba(255, 255, 255, 0.08); }
    .more-badge {
      background: rgba(0, 0, 0, 0.3); font-weight: bold; border-color: var(--card-color); color: var(--card-color);
    }
    
    .cat-native { --card-color: #61dafb; }
    .cat-motion { --card-color: #ff00ff; }
    .cat-monetization { --card-color: #00ffaa; }
    .cat-game { --card-color: #ff3366; }
    .cat-db { --card-color: #facc15; }
    .cat-frontend { --card-color: #a855f7; }
    .cat-diag { --card-color: #fb923c; }

    /* Modal Overlay Styles */
    .modal {
      display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
      overflow: auto; background-color: rgba(5, 10, 21, 0.9); backdrop-filter: blur(5px);
      align-items: center; justify-content: center;
    }
    .modal-content {
      background: var(--panel-bg); border: 1px solid var(--border-glow);
      padding: 20px; width: 90%; max-width: 800px; border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); max-height: 90vh;
      display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.5rem;
    }
    .modal-header h2 { font-family: var(--font-heading); color: var(--text-main); }
    .close-btn { color: var(--text-main); font-size: 28px; font-weight: bold; cursor: pointer; transition: color 0.2s; }
    .close-btn:hover { color: var(--accent-1); }
    .modal-body { overflow-y: auto; flex-grow: 1; padding-right: 10px; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

    @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } h1 { font-size: 2rem; } }
  
    
    .skill-cmd-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }
    .skill-cmd {
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--accent-1);
      font-family: var(--font-mono);
      border: 1px solid rgba(0,255,255,0.2);
      word-break: break-all;
      white-space: pre-wrap;
      user-select: all;
    }
    .copy-btn {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid var(--accent-1);
      color: var(--accent-1);
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .copy-btn:hover {
      background: rgba(0, 255, 255, 0.2);
    }
    .copy-btn:active {
      transform: scale(0.95);
    }
    .copy-btn.copied {
      background: var(--accent-1);
      color: #000;
    }
    .skill-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.2rem;
      letter-spacing: 0.05em;
    }
    .modal .skill-badge {
      text-align: left;
      padding: 1.25rem;
      border-width: 1px;
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
      cursor: pointer;
    }
    .modal .skill-badge:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--card-color);
      transform: translateY(-2px);
    }
    .modal-skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      padding-top: 5px;
      padding-bottom: 5px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin-right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .back-btn:hover {
      opacity: 1;
      color: var(--card-color);
    }
    .modal-title-container {
      display: flex;
      align-items: center;
    }

</style>

 "install_cmd": "npx skills@latest add prototype -g"}, {"id": "review-animations", "title": "Review Animations", "install_cmd": "npx skills@latest add review-animations -g"}]}, {"id": "vercel-labs/agent-skills", "title": "Vercel Labs Agent Skills", "install_cmd": "npx skills@latest add vercel-labs/agent-skills --skill '*' -g", "sub_skills": [{"id": "vercel-react-view-transitions", "title": "Vercel React View Transitions", "install_cmd": "npx skills@latest add vercel-react-view-transitions -g"}]}]}, "cat-diag": {"title": "\ud83d\udee0\ufe0f Diagnostics", "color": "#fb923c", "skills": [{"id": "vercel-labs/skills", "title": "Vercel Labs Skills", "install_cmd": "npx skills@latest add vercel-labs/skills --skill '*' -g", "sub_skills": [{"id": "find-skills", "title": "Find Skills", "install_cmd": "npx skills@latest add find-skills -g"}]}]}};
    
    
    const modal = document.getElementById('skillsModal');
    const closeBtn = document.querySelector('.close-btn');
    const modalTitle = document.getElementById('modalTitle');
    const modalSkills = document.getElementById('modalSkills');
    const modalBackBtn = document.getElementById('modalBackBtn');

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 1500);
      });
    }

    function renderSkillBadge(skillObj, color, isSubSkill = false) {
      const badge = document.createElement('div');
      badge.className = 'skill-badge';
      if (isSubSkill) {
        badge.style.padding = '0.8rem';
        badge.style.textAlign = 'center';
      }
      
      const titleEl = document.createElement('div');
      titleEl.className = 'skill-title';
      titleEl.style.color = color;
      titleEl.textContent = skillObj.title;
      badge.appendChild(titleEl);
      
      if (!isSubSkill) {
        const cmdContainer = document.createElement('div');
        cmdContainer.className = 'skill-cmd-container';

        const cmdEl = document.createElement('code');
        cmdEl.className = 'skill-cmd';
        cmdEl.textContent = skillObj.install_cmd;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToClipboard(skillObj.install_cmd, copyBtn);
        });

        cmdContainer.appendChild(cmdEl);
        cmdContainer.appendChild(copyBtn);
        badge.appendChild(cmdContainer);
      }

      badge.title = skillObj.id;
      return badge;
    }

    function openCategoryModal(catId) {
      const catData = categoriesData[catId];
      modalTitle.innerHTML = `<span style="color: ${catData.color}">` + catData.title + `</span>`;
      modalSkills.style.setProperty('--card-color', catData.color);
      modalBackBtn.style.display = 'none';
      modalSkills.innerHTML = '';

      catData.skills.forEach(skill => {
        const badge = renderSkillBadge(skill, catData.color);
        // If they click the badge inside the modal, dive into sub-skills if applicable
        badge.addEventListener('click', () => {
          if (skill.sub_skills && skill.sub_skills.length > 0) {
             openSubSkillsModal(skill, catData.color, catId);
          }
        });
        modalSkills.appendChild(badge);
      });
      
      modal.style.display = 'flex';
    }

    function openSubSkillsModal(skillObj, color, parentCatId = null) {
      modalTitle.innerHTML = `<span style="color: ${color}">` + skillObj.title + ` Sub-skills</span>`;
      modalSkills.style.setProperty('--card-color', color);
      modalSkills.innerHTML = '';
      
      if (parentCatId) {
        modalBackBtn.style.display = 'flex';
        modalBackBtn.onclick = () => openCategoryModal(parentCatId);
      } else {
        modalBackBtn.style.display = 'none';
      }

      skillObj.sub_skills.forEach(sub => {
        const badge = renderSkillBadge(sub, color, true);
        // Don't bind a deeper click handler for leaf nodes
        modalSkills.appendChild(badge);
      });

      modal.style.display = 'flex';
    }

    // Main page events
    
    
    
    
    const carouselTrack = document.getElementById('carouselTrack');
    
    let activeIndex = 0;
    let cards = [];
    let scrollAccumulator = 0;

    // Function to build a single card HTML string
    function createCardHTML(catId, catData) {
      const count = catData.skills.length;
      if (count === 0) return '';
      
      const visibleSkills = catData.skills.slice(0, 7);
      const moreCount = count - 7;
      
      let html = `<div class="category-card ${catId}" data-category="${catId}" style="--card-color: ${catData.color};">
        <div class="category-header">
          <h2 class="category-title"><span class="status-dot"></span>${catData.title}</h2>
          <span class="skill-count">${count}</span>
        </div>
        <div class="skills-grid">`;
        
      visibleSkills.forEach(s => {
        html += `<div class="skill-badge" title="${s.id}">${s.title}</div>`;
      });
      
      if (moreCount > 0) {
        html += `<div class="skill-badge more-badge">+${moreCount} more...</div>`;
      }
      
      html += `</div></div>`;
      return html;
    }

    function updateCoverFlow(animDuration = 0.6) {
      cards.forEach((card, i) => {
        const offset = i - activeIndex;
        
        let x = offset * 420; // Adjusted distance for the 400px wide cards
        let scale = offset === 0 ? 1 : 0.85;
        let opacity = offset === 0 ? 1 : (Math.abs(offset) > 2 ? 0 : 0.5);
        let rotationY = offset === 0 ? 0 : (offset > 0 ? -40 : 40); // Tilted INWARDS towards the center
        let zIndex = 50 - Math.abs(offset);

        gsap.to(card, {
          x: x,
          scale: scale,
          opacity: opacity,
          rotationY: rotationY,
          zIndex: zIndex,
          duration: animDuration,
          ease: "power3.out",
          overwrite: "auto"
        });
      });
    }

    function initCarousel() {
      let cardsHTML = '';
      for (const [catId, catData] of Object.entries(categoriesData)) {
        cardsHTML += createCardHTML(catId, catData);
      }
      
      carouselTrack.innerHTML = cardsHTML;
      cards = document.querySelectorAll('.category-card');
      activeIndex = Math.floor(cards.length / 2); // Start in the middle

      // Initial load animation - much slower for dramatic effect
      updateCoverFlow(2.5);

      // Scroll support for cover flow
      window.addEventListener('wheel', (e) => {
        // Prevent default scrolling if hovering over the dashboard area to stop page from jumping
        if (e.target.closest('.dashboard')) {
            e.preventDefault();
        }
        
        // Accumulate scroll delta
        scrollAccumulator += (e.deltaY + e.deltaX);
        
        // Threshold to trigger next/prev card
        if (scrollAccumulator > 80) {
          if (activeIndex < cards.length - 1) {
            activeIndex++;
            updateCoverFlow();
          }
          scrollAccumulator = 0;
        } else if (scrollAccumulator < -80) {
          if (activeIndex > 0) {
            activeIndex--;
            updateCoverFlow();
          }
          scrollAccumulator = 0;
        }
      }, { passive: false });

      
      // Touch support for cover flow
      let touchStartX = 0;
      let touchEndX = 0;

      window.addEventListener('touchstart', (e) => {
        if (e.target.closest('.dashboard')) {
          touchStartX = e.changedTouches[0].screenX;
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (e.target.closest('.dashboard')) {
          touchEndX = e.changedTouches[0].screenX;
          const threshold = 40; 
          if (touchEndX < touchStartX - threshold) {
            // Swiped left
            if (activeIndex < cards.length - 1) {
              activeIndex++;
              updateCoverFlow();
            }
          } else if (touchEndX > touchStartX + threshold) {
            // Swiped right
            if (activeIndex > 0) {
              activeIndex--;
              updateCoverFlow();
            }
          }
        }
      }, { passive: true });

      // Keyboard support

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && activeIndex > 0) {
          activeIndex--;
          updateCoverFlow();
        } else if (e.key === 'ArrowRight' && activeIndex < cards.length - 1) {
          activeIndex++;
          updateCoverFlow();
        }
      });

      cards.forEach((card, i) => {
        card.addEventListener('mouseenter', () => {
          gsap.to(card, {
            y: -20,
            scale: (i === activeIndex ? 1.05 : 0.90),
            duration: 0.3,
            ease: "power2.out"
          });
        });

        card.addEventListener('mouseleave', () => {
          const offset = i - activeIndex;
          const baseScale = offset === 0 ? 1 : 0.85;
          gsap.to(card, {
            y: 0,
            scale: baseScale,
            duration: 0.3,
            ease: "power2.in"
          });
        });

        card.addEventListener('click', (e) => {
          if (i !== activeIndex) {
            e.stopPropagation(); // prevent opening modal
            activeIndex = i;
            updateCoverFlow();
          }
        });
      });

      // Bind events to dynamically created cards
      bindCardEvents();
    }

    function bindCardEvents() {



      document.querySelectorAll('.category-card').forEach(card => {
        card.addEventListener('click', (e) => {
          const badgeEl = e.target.closest('.skill-badge');
          const catId = card.getAttribute('data-category');
          const catData = categoriesData[catId];

          if (badgeEl && !badgeEl.classList.contains('more-badge')) {
            const pkgId = badgeEl.getAttribute('title');
            const pkgData = catData.skills.find(s => s.id === pkgId);
            if (pkgData) {
              if (pkgData.sub_skills && pkgData.sub_skills.length > 0) {
                 openSubSkillsModal(pkgData, catData.color);
              } else {
                 openCategoryModal(catId);
              }
            }
          } else {
            openCategoryModal(catId);
          }
        });
      });
    }
    
    // Initialize Marquee on load
    initCarousel();
    

    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    window.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    });

  </script>
