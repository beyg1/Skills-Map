<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Skills & MCP Map</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap');

    :root {
      --bg-color: #050a15;
      --panel-bg: rgba(10, 20, 40, 0.85);
      --border-color: rgba(0, 255, 255, 0.2);
      --border-glow: rgba(0, 255, 255, 0.5);
      --text-main: #e0f2fe;
      --accent-1: #00ffff;
      --accent-2: #ff00ff;
      --accent-3: #00ffaa;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    @keyframes gridMove {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 30px 30px;
      }
    }

    @keyframes scanLine {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }

      10% {
        opacity: 0.7;
      }

      90% {
        opacity: 0.7;
      }

      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    @keyframes dotBlink {

      0%,
      100% {
        opacity: 0.3;
        box-shadow: 0 0 2px currentColor;
      }

      50% {
        opacity: 1;
        box-shadow: 0 0 10px currentColor;
      }
    }

    @keyframes countPulse {

      0%,
      100% {
        opacity: 0.8;
        text-shadow: 0 0 5px currentColor;
      }

      50% {
        opacity: 1;
        text-shadow: 0 0 15px currentColor;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      padding: 1.5rem;
      animation: gridMove 5s linear infinite;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 0%, var(--bg-color) 100%);
      pointer-events: none;
      z-index: -1;
    }

    .scanner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 3px;
      background: var(--accent-1);
      box-shadow: 0 0 15px var(--accent-1);
      animation: scanLine 6s linear infinite;
      z-index: 1000;
      pointer-events: none;
    }

    header {
      margin-bottom: 2rem;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-container {
      width: 100%;
      max-width: 1400px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .header-titles {
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 2.3rem;
      color: var(--accent-1);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-shadow: 0 0 10px var(--accent-1), 0 0 20px var(--accent-1);
      margin-bottom: 0.4rem;
      transition: all 0.3s;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--accent-3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.85;
      transition: all 0.3s;
    }

    /* Top Right Mode Switcher */
    .view-switcher {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      background: rgba(10, 20, 40, 0.85);
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 4px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
      gap: 6px;
      z-index: 100;
    }

    .switcher-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      font-family: var(--font-heading);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 1.1rem;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.65;
    }

    .switcher-btn:hover {
      opacity: 1;
      color: var(--accent-1);
    }

    .switcher-btn.active {
      background: rgba(0, 255, 255, 0.18);
      border-color: var(--accent-1);
      color: var(--accent-1);
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.4), inset 0 0 8px rgba(0, 255, 255, 0.2);
      opacity: 1;
    }

    @media (max-width: 992px) {
      .header-container {
        padding-top: 0.5rem;
      }

      .view-switcher {
        position: static;
        transform: none;
        margin-top: 1rem;
      }
    }

    .dashboard {
      width: 100%;
      height: 75vh;
      min-height: 600px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .carousel-track {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .category-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2.5rem;
      position: absolute;
      width: 400px;
      height: 550px;
      max-height: 80vh;
      overflow-y: auto;
      transition: border-color 0.3s, box-shadow 0.3s;
      cursor: pointer;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .category-card::-webkit-scrollbar {
      display: none;
    }

    .category-card:hover {
      border-color: var(--card-color);
      box-shadow: 0 10px 30px -10px var(--card-color);
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    .category-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      color: var(--card-color);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--card-color);
      margin-right: 0.6rem;
      animation: dotBlink 2s ease-in-out infinite;
    }

    .skill-count {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.2);
      color: var(--card-color);
      padding: 0.2rem 0.8rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: countPulse 3s ease-in-out infinite;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.6rem;
      flex-grow: 1;
      align-content: start;
    }

    .mcp-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex-grow: 1;
    }

    .mcp-card-item {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem;
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .mcp-card-item:hover {
      border-color: var(--card-color);
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .mcp-card-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mcp-card-item-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .mcp-card-item-tools {
      font-size: 0.75rem;
      color: var(--card-color);
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.5rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .mcp-card-item-desc {
      font-size: 0.8rem;
      color: rgba(224, 242, 254, 0.7);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skill-badge {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.5rem;
      border-radius: 4px;
      text-align: center;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      word-break: break-word;
      line-height: 1.2;
    }

    .skill-badge:hover {
      border-color: var(--card-color);
      color: var(--card-color);
      background: rgba(255, 255, 255, 0.08);
    }

    .more-badge {
      background: rgba(0, 0, 0, 0.3);
      font-weight: bold;
      border-color: var(--card-color);
      color: var(--card-color);
    }

    /* Modal Overlay Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(5, 10, 21, 0.92);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      padding: 24px;
      width: 90%;
      max-width: 900px;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.75rem;
    }

    .modal-header h2 {
      font-family: var(--font-heading);
      color: var(--text-main);
      font-size: 1.4rem;
    }

    .close-btn {
      color: var(--text-main);
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--accent-1);
    }

    .modal-body {
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 8px;
    }

    .skill-cmd-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }

    .skill-cmd {
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.5rem 0.7rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--accent-1);
      font-family: var(--font-mono);
      border: 1px solid rgba(0, 255, 255, 0.2);
      word-break: break-all;
      white-space: pre-wrap;
      user-select: all;
    }

    .copy-btn {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid var(--accent-1);
      color: var(--accent-1);
      border-radius: 4px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .copy-btn.copied {
      background: var(--accent-1);
      color: #000;
      font-weight: bold;
    }

    .skill-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.2rem;
      letter-spacing: 0.05em;
    }

    .modal .skill-badge {
      text-align: left;
      padding: 1.25rem;
      border-width: 1px;
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
      cursor: pointer;
    }

    .modal .skill-badge:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--card-color);
      transform: translateY(-2px);
    }

    .modal-skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      padding-top: 5px;
      padding-bottom: 5px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin-right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .back-btn:hover {
      opacity: 1;
      color: var(--card-color);
    }

    .modal-title-container {
      display: flex;
      align-items: center;
    }

    /* MCP Detailed Modal Cards */
    .mcp-detail-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .mcp-server-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      transition: all 0.25s ease;
      position: relative;
    }

    .mcp-server-card:hover {
      border-color: var(--card-color);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
    }

    .mcp-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .mcp-server-title {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--card-color);
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mcp-badge-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .mcp-tool-pill {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-color);
      color: var(--card-color);
      padding: 0.2rem 0.65rem;
      border-radius: 12px;
      white-space: nowrap;
    }

    .mcp-description {
      font-family: var(--font-body);
      font-size: 1rem;
      color: rgba(224, 242, 254, 0.9);
      line-height: 1.45;
    }

    .mcp-caps-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .mcp-cap-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
    }

    .mcp-links-row {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-top: 0.3rem;
    }

    .mcp-link-btn {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      text-decoration: none;
      padding: 0.4rem 0.85rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border: 1px solid rgba(0, 255, 255, 0.4);
      background: rgba(0, 255, 255, 0.08);
      color: var(--accent-1);
      transition: all 0.2s;
    }

    .mcp-link-btn:hover {
      background: var(--accent-1);
      color: #050a15;
      box-shadow: 0 0 10px var(--accent-1);
      transform: translateY(-1px);
    }

    .mcp-link-btn.secondary {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
    }

    .mcp-link-btn.secondary:hover {
      background: var(--text-main);
      color: #050a15;
      box-shadow: 0 0 10px var(--text-main);
    }
  </style>
</head>

<body>
  <div class="scanner"></div>

  <header>
    <div class="header-container">
      <div class="header-titles">
        <h1 id="mainTitle">Agent Skills Map</h1>
        <div id="mainSubtitle" class="subtitle">System Initialization: 25 Skill Packages (127 Skills) Loaded</div>
      </div>
      <div class="view-switcher">
        <button id="skillsBtn" class="switcher-btn active" onclick="switchMode('skills')">
          <span class="switcher-icon">⚡</span>
          <span>Agent Skills</span>
        </button>
        <button id="mcpBtn" class="switcher-btn" onclick="switchMode('mcp')">
          <span class="switcher-icon">🔌</span>
          <span>MCP Servers</span>
        </button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <div class="carousel-track" id="carouselTrack"></div>
  </main>

  <!-- Modal Overlay -->
  <div id="skillsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-container">
          <button id="modalBackBtn" class="back-btn" style="display:none;">&larr; Back</button>
          <h2 id="modalTitle">Category</h2>
        </div>
        <span class="close-btn">&times;</span>
      </div>
      <div class="modal-body">
        <div id="modalSkills" class="modal-skills-grid" style="--card-color: #00ffff;"></div>
      </div>
    </div>
  </div>

  <script>

              "App Store Keyword Ranking & Volume",
              "User Review Scraping & Sentiment",
              "App Pricing & Version History",
              "Competitor App Details & Metadata"
            ]
          }
        ]
      },
      "cat-mcp-infra": {
        "title": "⚡ Cloud Infra & Docs",
        "color": "#61dafb",
        "servers": [
          {
            "id": "supabase",
            "title": "Supabase Cloud Platform",
            "tool_count": 30,
            "github_url": "https://github.com/supabase/supabase",
            "website_url": "https://supabase.com/docs/guides/ai/mcp",
            "description": "Complete Supabase backend control. Execute SQL queries, manage database migrations, create database branches, deploy Edge Functions, and analyze security advisors.",
            "capabilities": [
              "Execute SQL & Manage Tables",
              "Database Migrations & Branching",
              "Deploy Edge Functions",
              "Fetch Project Keys & API URLs",
              "Query Logs & Performance Advisors"
            ]
          },
          {
            "id": "context7",
            "title": "Context7 Docs Engine",
            "tool_count": 3,
            "github_url": "https://github.com/upstash/context7",
            "website_url": "https://context7.com",
            "description": "Real-time SDK and library documentation retrieval system. Resolves library identifiers and fetches exact, up-to-date API references to prevent coding hallucinations.",
            "capabilities": [
              "Real-Time Library ID Resolution",
              "Direct Framework Documentation Query",
              "Up-to-Date SDK Method Signatures"
            ]
          }
        ]
      }
    };

    // State Variables
    let currentMode = 'skills'; // 'skills' | 'mcp'
    const modal = document.getElementById('skillsModal');
    const closeBtn = document.querySelector('.close-btn');
    const modalTitle = document.getElementById('modalTitle');
    const modalSkills = document.getElementById('modalSkills');
    const modalBackBtn = document.getElementById('modalBackBtn');
    const carouselTrack = document.getElementById('carouselTrack');
    const mainTitle = document.getElementById('mainTitle');
    const mainSubtitle = document.getElementById('mainSubtitle');
    const skillsBtn = document.getElementById('skillsBtn');
    const mcpBtn = document.getElementById('mcpBtn');

    let activeIndex = 0;
    let cards = [];
    let scrollAccumulator = 0;

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 1500);
      });
    }

    // Render Badge for Agent Skills
    function renderSkillBadge(skillObj, color, isSubSkill = false) {
      const badge = document.createElement('div');
      badge.className = 'skill-badge';
      if (isSubSkill) {
        badge.style.padding = '0.8rem';
        badge.style.textAlign = 'center';
      }

      const titleEl = document.createElement('div');
      titleEl.className = 'skill-title';
      titleEl.style.color = color;
      titleEl.textContent = skillObj.title;
      badge.appendChild(titleEl);

      if (!isSubSkill) {
        const cmdContainer = document.createElement('div');
        cmdContainer.className = 'skill-cmd-container';

        const cmdEl = document.createElement('code');
        cmdEl.className = 'skill-cmd';
        cmdEl.textContent = skillObj.install_cmd;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToClipboard(skillObj.install_cmd, copyBtn);
        });

        cmdContainer.appendChild(cmdEl);
        cmdContainer.appendChild(copyBtn);
        badge.appendChild(cmdContainer);
      }

      badge.title = skillObj.id;
      return badge;
    }

    // Open Agent Skills Category Modal
    function openCategoryModal(catId) {
      const catData = categoriesData[catId];
      if (!catData) return;

      modalTitle.innerHTML = `<span style="color: ${catData.color}">` + catData.title + `</span>`;
      modalSkills.style.setProperty('--card-color', catData.color);
      modalSkills.className = 'modal-skills-grid';
      modalBackBtn.style.display = 'none';
      modalSkills.innerHTML = '';

      catData.skills.forEach(skill => {
        const badge = renderSkillBadge(skill, catData.color);
        badge.addEventListener('click', () => {
          if (skill.sub_skills && skill.sub_skills.length > 0) {
            openSubSkillsModal(skill, catData.color, catId);
          }
        });
        modalSkills.appendChild(badge);
      });

      modal.style.display = 'flex';
    }

    // Open Agent Sub-skills Modal
    function openSubSkillsModal(skillObj, color, parentCatId = null) {
      modalTitle.innerHTML = `<span style="color: ${color}">` + skillObj.title + ` Sub-skills</span>`;
      modalSkills.style.setProperty('--card-color', color);
      modalSkills.className = 'modal-skills-grid';
      modalSkills.innerHTML = '';

      if (parentCatId) {
        modalBackBtn.style.display = 'flex';
        modalBackBtn.onclick = () => openCategoryModal(parentCatId);
      } else {
        modalBackBtn.style.display = 'none';
      }

      skillObj.sub_skills.forEach(sub => {
        const badge = renderSkillBadge(sub, color, true);
        modalSkills.appendChild(badge);
      });

      modal.style.display = 'flex';
    }

    // Open MCP Category Modal with Server Details
    function openMcpCategoryModal(catId) {
      const catData = mcpCategoriesData[catId];
      if (!catData) return;

      modalTitle.innerHTML = `<span style="color: ${catData.color}">` + catData.title + `</span>`;
      modalSkills.style.setProperty('--card-color', catData.color);
      modalSkills.className = 'mcp-detail-grid';
      modalBackBtn.style.display = 'none';
      modalSkills.innerHTML = '';

      catData.servers.forEach(server => {
        const card = document.createElement('div');
        card.className = 'mcp-server-card';
        card.style.setProperty('--card-color', catData.color);

        // Header
        const header = document.createElement('div');
        header.className = 'mcp-card-header';

        const title = document.createElement('div');
        title.className = 'mcp-server-title';
        title.textContent = server.title;

        const badgeGroup = document.createElement('div');
        badgeGroup.className = 'mcp-badge-group';

        const toolPill = document.createElement('span');
        toolPill.className = 'mcp-tool-pill';
        toolPill.textContent = `${server.tool_count} Tools`;

        badgeGroup.appendChild(toolPill);
        header.appendChild(title);
        header.appendChild(badgeGroup);
        card.appendChild(header);

        // Description
        const desc = document.createElement('div');
        desc.className = 'mcp-description';
        desc.textContent = server.description;
        card.appendChild(desc);

        // Capabilities Tags
        if (server.capabilities && server.capabilities.length > 0) {
          const capsContainer = document.createElement('div');
          capsContainer.className = 'mcp-caps-container';
          server.capabilities.forEach(cap => {
            const capTag = document.createElement('span');
            capTag.className = 'mcp-cap-tag';
            capTag.textContent = cap;
            capsContainer.appendChild(capTag);
          });
          card.appendChild(capsContainer);
        }

        // Links Row
        const linksRow = document.createElement('div');
        linksRow.className = 'mcp-links-row';

        if (server.github_url) {
          const ghLink = document.createElement('a');
          ghLink.className = 'mcp-link-btn';
          ghLink.href = server.github_url;
          ghLink.target = '_blank';
          ghLink.rel = 'noopener noreferrer';
          ghLink.innerHTML = '<span>⚡</span> GitHub Repo';
          linksRow.appendChild(ghLink);
        }

        if (server.website_url) {
          const webLink = document.createElement('a');
          webLink.className = 'mcp-link-btn secondary';
          webLink.href = server.website_url;
          webLink.target = '_blank';
          webLink.rel = 'noopener noreferrer';
          webLink.innerHTML = '<span>🌐</span> Official Docs';
          linksRow.appendChild(webLink);
        }

        card.appendChild(linksRow);
        modalSkills.appendChild(card);
      });

      modal.style.display = 'flex';
    }

    // Build Single Card HTML for Agent Skills Mode
    function createSkillsCardHTML(catId, catData) {
      const count = catData.skills.length;
      if (count === 0) return '';

      const visibleSkills = catData.skills.slice(0, 7);
      const moreCount = count - 7;

      let html = `<div class="category-card ${catId}" data-category="${catId}" style="--card-color: ${catData.color};">
        <div class="category-header">
          <h2 class="category-title"><span class="status-dot"></span>${catData.title}</h2>
          <span class="skill-count">${count}</span>
        </div>
        <div class="skills-grid">`;

      visibleSkills.forEach(s => {
        html += `<div class="skill-badge" title="${s.id}">${s.title}</div>`;
      });

      if (moreCount > 0) {
        html += `<div class="skill-badge more-badge">+${moreCount} more...</div>`;
      }

      html += `</div></div>`;
      return html;
    }

    // Build Single Card HTML for MCP Servers Mode
    function createMcpCardHTML(catId, catData) {
      const count = catData.servers.length;
      if (count === 0) return '';

      let html = `<div class="category-card ${catId}" data-category="${catId}" style="--card-color: ${catData.color};">
        <div class="category-header">
          <h2 class="category-title"><span class="status-dot"></span>${catData.title}</h2>
          <span class="skill-count">${count} MCPs</span>
        </div>
        <div class="mcp-grid">`;

      catData.servers.forEach(s => {
        html += `<div class="mcp-card-item" title="${s.title}">
          <div class="mcp-card-item-header">
            <span class="mcp-card-item-title">${s.title}</span>
            <span class="mcp-card-item-tools">${s.tool_count} Tools</span>
          </div>
          <div class="mcp-card-item-desc">${s.description}</div>
        </div>`;
      });

      html += `</div></div>`;
      return html;
    }

    // Update 3D Cover Flow Positions with GSAP
    function updateCoverFlow(animDuration = 0.6) {
      cards.forEach((card, i) => {
        const offset = i - activeIndex;

        let x = offset * 420;
        let scale = offset === 0 ? 1 : 0.85;
        let opacity = offset === 0 ? 1 : (Math.abs(offset) > 2 ? 0 : 0.5);
        let rotationY = offset === 0 ? 0 : (offset > 0 ? -40 : 40); // Inward tilt
        let zIndex = 50 - Math.abs(offset);

        gsap.to(card, {
          x: x,
          scale: scale,
          opacity: opacity,
          rotationY: rotationY,
          zIndex: zIndex,
          duration: animDuration,
          ease: "power3.out",
          overwrite: "auto"
        });
      });
    }

    // Initialize 3D Carousel
    function initCarousel() {
      let cardsHTML = '';

      if (currentMode === 'skills') {
        for (const [catId, catData] of Object.entries(categoriesData)) {
          cardsHTML += createSkillsCardHTML(catId, catData);
        }
      } else {
        for (const [catId, catData] of Object.entries(mcpCategoriesData)) {
          cardsHTML += createMcpCardHTML(catId, catData);
        }
      }

      carouselTrack.innerHTML = cardsHTML;
      cards = document.querySelectorAll('.category-card');
      activeIndex = Math.floor(cards.length / 2);

      // Smooth initial positioning
      updateCoverFlow(2.0);

      // Card hover animations
      cards.forEach((card, i) => {
        card.addEventListener('mouseenter', () => {
          gsap.to(card, {
            y: -20,
            scale: (i === activeIndex ? 1.05 : 0.90),
            duration: 0.3,
            ease: "power2.out"
          });
        });

        card.addEventListener('mouseleave', () => {
          const offset = i - activeIndex;
          const baseScale = offset === 0 ? 1 : 0.85;
          gsap.to(card, {
            y: 0,
            scale: baseScale,
            duration: 0.3,
            ease: "power2.in"
          });
        });

        card.addEventListener('click', (e) => {
          if (i !== activeIndex) {
            e.stopPropagation();
            activeIndex = i;
            updateCoverFlow();
          }
        });
      });

      bindCardEvents();
    }

    // Bind Click Events on Category Cards
    function bindCardEvents() {
      document.querySelectorAll('.category-card').forEach(card => {
        card.addEventListener('click', (e) => {
          const catId = card.getAttribute('data-category');

          if (currentMode === 'skills') {
            const badgeEl = e.target.closest('.skill-badge');
            const catData = categoriesData[catId];

            if (badgeEl && !badgeEl.classList.contains('more-badge')) {
              const pkgId = badgeEl.getAttribute('title');
              const pkgData = catData.skills.find(s => s.id === pkgId);
              if (pkgData && pkgData.sub_skills && pkgData.sub_skills.length > 0) {
                openSubSkillsModal(pkgData, catData.color);
              } else {
                openCategoryModal(catId);
              }
            } else {
              openCategoryModal(catId);
            }
          } else {
            openMcpCategoryModal(catId);
          }
        });
      });
    }

    // Switch between Agent Skills and MCP Servers
    function switchMode(mode, updateHash = true) {
      if (mode === currentMode) return;
      currentMode = mode;

      if (mode === 'skills') {
        skillsBtn.classList.add('active');
        mcpBtn.classList.remove('active');
        mainTitle.textContent = 'Agent Skills Map';
        mainSubtitle.textContent = 'System Initialization: 25 Skill Packages (127 Skills) Loaded';
        if (updateHash) window.location.hash = '#skills';
      } else {
        mcpBtn.classList.add('active');
        skillsBtn.classList.remove('active');
        mainTitle.textContent = 'MCP MAP';
        mainSubtitle.textContent = 'System Active: 7 MCP Servers Configured (183 Tools)';
        if (updateHash) window.location.hash = '#mcp';
      }

      initCarousel();
    }

    // Wheel Scroll Support
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.dashboard')) {
        e.preventDefault();
      }

      scrollAccumulator += (e.deltaY + e.deltaX);

      if (scrollAccumulator > 80) {
        if (activeIndex < cards.length - 1) {
          activeIndex++;
          updateCoverFlow();
        }
        scrollAccumulator = 0;
      } else if (scrollAccumulator < -80) {
        if (activeIndex > 0) {
          activeIndex--;
          updateCoverFlow();
        }
        scrollAccumulator = 0;
      }
    }, { passive: false });

    // Touch Support for Cover Flow with Intensity Multiplier
    let touchStartX = 0;
    let touchEndX = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.dashboard')) {
        touchStartX = e.changedTouches[0].screenX;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.target.closest('.dashboard')) {
        touchEndX = e.changedTouches[0].screenX;
        const deltaX = touchStartX - touchEndX;
        const absDelta = Math.abs(deltaX);

        if (absDelta > 40) {
          let cardsToScroll = Math.max(1, Math.floor(absDelta / 80));

          if (deltaX > 0) {
            activeIndex = Math.min(cards.length - 1, activeIndex + cardsToScroll);
          } else {
            activeIndex = Math.max(0, activeIndex - cardsToScroll);
          }
          updateCoverFlow();
        }
      }
    }, { passive: true });

    // Keyboard Arrow Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && activeIndex > 0) {
        activeIndex--;
        updateCoverFlow();
      } else if (e.key === 'ArrowRight' && activeIndex < cards.length - 1) {
        activeIndex++;
        updateCoverFlow();
      }
    });

    // Close Modal
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    window.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    });

    // Handle Hash Routing
    function handleRouting() {
      const hash = window.location.hash.toLowerCase();
      if (hash === '#mcp') {
        switchMode('mcp', false);
      } else {
        switchMode('skills', false);
      }
    }

    window.addEventListener('hashchange', handleRouting);

    // Initial Load
    handleRouting();
    initCarousel();
  </script>
</body>
