<svg viewBox="0 0 1000 680" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <style>
    @keyframes scanLine {
      0% { transform: translateY(-20px); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(700px); opacity: 0; }
    }
    @keyframes borderGlow1 {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes borderGlow2 {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes borderGlow3 {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes countPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes tagSlide {
      0% { transform: translateX(-4px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .card-bg { fill: #0f1219; }
    .card-border { fill: none; stroke-width: 1.5; }
    .card-title { fill: #e5e7eb; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
    .card-count { font-size: 42px; font-weight: 800; animation: countPulse 3s ease-in-out infinite; }
    .card-label { fill: #6b7280; font-size: 10px; font-weight: 600; letter-spacing: 1px; }
    .tag { font-size: 10px; font-weight: 600; }
    .tag-bg { rx: 4; ry: 4; height: 20px; opacity: 0.15; }
    .status-dot { r: 3; animation: dotBlink 2s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8, 12; animation: dataStream 2s linear infinite; }
  </style>

  <defs>
    <linearGradient id="dcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="dpink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="damber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dgreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dpurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="dsilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <clipPath id="dashClip">
      <rect width="1000" height="680" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="12" fill="#080b11"/>

  <!-- Scan line -->
  <g clip-path="url(#dashClip)">
    <rect width="1000" height="3" fill="url(#dcyan)" style="animation: scanLine 6s linear infinite;"/>
  </g>

  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="333" y1="0" x2="333" y2="680" stroke="#4facfe" stroke-width="1"/>
    <line x1="666" y1="0" x2="666" y2="680" stroke="#4facfe" stroke-width="1"/>
    <line x1="0" y1="340" x2="1000" y2="340" stroke="#4facfe" stroke-width="1"/>
  </g>

  <!-- Data stream lines between cards -->
  <g opacity="0.12">
    <line x1="310" y1="170" x2="360" y2="170" stroke="#00f2fe" stroke-width="1" class="stream-line"/>
    <line x1="643" y1="170" x2="693" y2="170" stroke="#ff0844" stroke-width="1" class="stream-line"/>
    <line x1="310" y1="510" x2="360" y2="510" stroke="#fbbf24" stroke-width="1" class="stream-line"/>
    <line x1="643" y1="510" x2="693" y2="510" stroke="#34d399" stroke-width="1" class="stream-line"/>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 1 -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Card 1: Native & Expo -->
  <g transform="translate(20, 20)">
    <rect class="card-bg" width="300" height="300" rx="10"/>
    <rect class="card-border" width="300" height="300" rx="10" stroke="url(#dcyan)" style="animation: borderGlow1 4s ease-in-out infinite;"/>
    <!-- Status dot -->
    <circle cx="22" cy="22" class="status-dot" fill="#00f2fe"/>
    <text x="34" y="26" fill="#00f2fe" font-size="9" font-weight="700" letter-spacing="1">ACTIVE</text>
    <!-- Title -->
    <text x="150" y="70" text-anchor="middle" class="card-title">NATIVE &amp; EXPO</text>
    <!-- Count -->
    <text x="150" y="140" text-anchor="middle" class="card-count" fill="#00f2fe">16</text>
    <text x="150" y="160" text-anchor="middle" class="card-label">SKILLS LOADED</text>
    <!-- Tags Row 1 -->
    <rect x="20" y="185" width="75" height="20" class="tag-bg" fill="#00f2fe"/>
    <text x="57" y="199" text-anchor="middle" class="tag" fill="#00f2fe">SwiftUI</text>
    <rect x="103" y="185" width="90" height="20" class="tag-bg" fill="#00f2fe"/>
    <text x="148" y="199" text-anchor="middle" class="tag" fill="#00f2fe">Compose</text>
    <rect x="201" y="185" width="80" height="20" class="tag-bg" fill="#00f2fe"/>
    <text x="241" y="199" text-anchor="middle" class="tag" fill="#00f2fe">EAS Build</text>
    <!-- Tags Row 2 -->
    <rect x="20" y="213" width="95" height="20" class="tag-bg" fill="#4facfe"/>
    <text x="67" y="227" text-anchor="middle" class="tag" fill="#4facfe">DOM Comp</text>
    <rect x="123" y="213" width="65" height="20" class="tag-bg" fill="#4facfe"/>
    <text x="155" y="227" text-anchor="middle" class="tag" fill="#4facfe">CI/CD</text>
    <rect x="196" y="213" width="85" height="20" class="tag-bg" fill="#4facfe"/>
    <text x="238" y="227" text-anchor="middle" class="tag" fill="#4facfe">App Clips</text>
    <!-- Tags Row 3 -->
    <rect x="20" y="241" width="85" height="20" class="tag-bg" fill="#4facfe"/>
    <text x="62" y="255" text-anchor="middle" class="tag" fill="#4facfe">Modules</text>
    <rect x="113" y="241" width="95" height="20" class="tag-bg" fill="#4facfe"/>
    <text x="160" y="255" text-anchor="middle" class="tag" fill="#4facfe">Brownfield</text>
    <rect x="216" y="241" width="65" height="20" class="tag-bg" fill="#4facfe"/>
    <text x="248" y="255" text-anchor="middle" class="tag" fill="#4facfe">OTA</text>
  </g>

  <!-- Card 2: Motion & Animation -->
  <g transform="translate(350, 20)">
