    <text x="47" y="227" text-anchor="middle" class="tag" fill="#8b5cf6">a11y</text>
    <rect x="83" y="213" width="60" height="20" class="tag-bg" fill="#8b5cf6"/>
    <text x="113" y="227" text-anchor="middle" class="tag" fill="#8b5cf6">MCP</text>
    <rect x="151" y="213" width="65" height="20" class="tag-bg" fill="#8b5cf6"/>
    <text x="183" y="227" text-anchor="middle" class="tag" fill="#8b5cf6">AGY</text>
    <rect x="224" y="213" width="57" height="20" class="tag-bg" fill="#8b5cf6"/>
