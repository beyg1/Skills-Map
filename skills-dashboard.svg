    <rect class="card-border" width="300" height="300" rx="10" stroke="url(#dpink)" style="animation: borderGlow3 4s ease-in-out infinite; animation-delay: 2s;"/>
    <circle cx="22" cy="22" class="status-dot" fill="#ff0844" style="animation-delay: 1s;"/>
    <text x="34" y="26" fill="#ff0844" font-size="9" font-weight="700" letter-spacing="1">ACTIVE</text>
    <text x="150" y="70" text-anchor="middle" class="card-title">MONETIZATION</text>
    <text x="150" y="140" text-anchor="middle" class="card-count" fill="#ff0844" style="animation-delay: 1s;">15</text>
    <text x="150" y="160" text-anchor="middle" class="card-label">SKILLS LOADED</text>
    <rect x="20" y="185" width="105" height="20" class="tag-bg" fill="#ff0844"/>
    <text x="72" y="199" text-anchor="middle" class="tag" fill="#ff0844">RevenueCat</text>
    <rect x="133" y="185" width="85" height="20" class="tag-bg" fill="#ff0844"/>
    <text x="175" y="199" text-anchor="middle" class="tag" fill="#ff0844">Superwall</text>
    <rect x="226" y="185" width="55" height="20" class="tag-bg" fill="#ff0844"/>
    <text x="253" y="199" text-anchor="middle" class="tag" fill="#ff0844">A/B</text>
    <rect x="20" y="213" width="85" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="62" y="227" text-anchor="middle" class="tag" fill="#ffb199">Paywalls</text>
    <rect x="113" y="213" width="105" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="165" y="227" text-anchor="middle" class="tag" fill="#ffb199">Entitlements</text>
    <rect x="226" y="213" width="55" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="253" y="227" text-anchor="middle" class="tag" fill="#ffb199">MRR</text>
    <rect x="20" y="241" width="80" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="60" y="255" text-anchor="middle" class="tag" fill="#ffb199">StoreKit</text>
    <rect x="108" y="241" width="75" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="145" y="255" text-anchor="middle" class="tag" fill="#ffb199">Migrate</text>
    <rect x="191" y="241" width="90" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="236" y="255" text-anchor="middle" class="tag" fill="#ffb199">Customer</text>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 2 -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Card 4: Frontend & Web -->
  <g transform="translate(20, 360)">
    <rect class="card-bg" width="300" height="300" rx="10"/>
    <rect class="card-border" width="300" height="300" rx="10" stroke="url(#damber)" style="animation: borderGlow1 5s ease-in-out infinite; animation-delay: 0.5s;"/>
    <circle cx="22" cy="22" class="status-dot" fill="#fbbf24" style="animation-delay: 1.5s;"/>
    <text x="34" y="26" fill="#fbbf24" font-size="9" font-weight="700" letter-spacing="1">ACTIVE</text>
    <text x="150" y="70" text-anchor="middle" class="card-title">FRONTEND &amp; WEB</text>
    <text x="150" y="140" text-anchor="middle" class="card-count" fill="#fbbf24" style="animation-delay: 1.5s;">5</text>
    <text x="150" y="160" text-anchor="middle" class="card-label">SKILLS LOADED</text>
    <rect x="20" y="185" width="105" height="20" class="tag-bg" fill="#fbbf24"/>
    <text x="72" y="199" text-anchor="middle" class="tag" fill="#fbbf24">Anti-Slop UI</text>
    <rect x="133" y="185" width="70" height="20" class="tag-bg" fill="#fbbf24"/>
    <text x="168" y="199" text-anchor="middle" class="tag" fill="#fbbf24">Chrome</text>
    <rect x="211" y="185" width="70" height="20" class="tag-bg" fill="#fbbf24"/>
    <text x="246" y="199" text-anchor="middle" class="tag" fill="#fbbf24">MV3</text>
    <rect x="20" y="213" width="100" height="20" class="tag-bg" fill="#f59e0b"/>
    <text x="70" y="227" text-anchor="middle" class="tag" fill="#f59e0b">View Trans</text>
    <rect x="128" y="213" width="90" height="20" class="tag-bg" fill="#f59e0b"/>
    <text x="173" y="227" text-anchor="middle" class="tag" fill="#f59e0b">Container Q</text>
    <rect x="226" y="213" width="55" height="20" class="tag-bg" fill="#f59e0b"/>
    <text x="253" y="227" text-anchor="middle" class="tag" fill="#f59e0b">:has()</text>
    <rect x="20" y="241" width="95" height="20" class="tag-bg" fill="#f59e0b"/>
    <text x="67" y="255" text-anchor="middle" class="tag" fill="#f59e0b">Screenshots</text>
    <rect x="123" y="241" width="105" height="20" class="tag-bg" fill="#f59e0b"/>
    <text x="175" y="255" text-anchor="middle" class="tag" fill="#f59e0b">Design×2</text>
  </g>

  <!-- Card 5: Database -->
  <g transform="translate(350, 360)">
    <rect class="card-bg" width="300" height="300" rx="10"/>
    <rect class="card-border" width="300" height="300" rx="10" stroke="url(#dgreen)" style="animation: borderGlow2 5s ease-in-out infinite; animation-delay: 1.5s;"/>
    <circle cx="22" cy="22" class="status-dot" fill="#34d399" style="animation-delay: 2s;"/>
    <text x="34" y="26" fill="#34d399" font-size="9" font-weight="700" letter-spacing="1">ACTIVE</text>
    <text x="150" y="70" text-anchor="middle" class="card-title">POSTGRES DB</text>
    <text x="150" y="140" text-anchor="middle" class="card-count" fill="#34d399" style="animation-delay: 2s;">2</text>
    <text x="150" y="160" text-anchor="middle" class="card-label">SKILLS LOADED</text>
    <rect x="20" y="185" width="95" height="20" class="tag-bg" fill="#34d399"/>
    <text x="67" y="199" text-anchor="middle" class="tag" fill="#34d399">Supabase</text>
    <rect x="123" y="185" width="55" height="20" class="tag-bg" fill="#34d399"/>
    <text x="150" y="199" text-anchor="middle" class="tag" fill="#34d399">RLS</text>
    <rect x="186" y="185" width="95" height="20" class="tag-bg" fill="#34d399"/>
    <text x="233" y="199" text-anchor="middle" class="tag" fill="#34d399">Realtime</text>
    <rect x="20" y="213" width="80" height="20" class="tag-bg" fill="#10b981"/>
    <text x="60" y="227" text-anchor="middle" class="tag" fill="#10b981">GIN Index</text>
    <rect x="108" y="213" width="105" height="20" class="tag-bg" fill="#10b981"/>
    <text x="160" y="227" text-anchor="middle" class="tag" fill="#10b981">Supavisor</text>
    <rect x="221" y="213" width="60" height="20" class="tag-bg" fill="#10b981"/>
    <text x="251" y="227" text-anchor="middle" class="tag" fill="#10b981">JSONB</text>
    <rect x="20" y="241" width="80" height="20" class="tag-bg" fill="#10b981"/>
    <text x="60" y="255" text-anchor="middle" class="tag" fill="#10b981">Vectors</text>
    <rect x="108" y="241" width="95" height="20" class="tag-bg" fill="#10b981"/>
    <text x="155" y="255" text-anchor="middle" class="tag" fill="#10b981">Edge Func</text>
    <rect x="211" y="241" width="70" height="20" class="tag-bg" fill="#10b981"/>
    <text x="246" y="255" text-anchor="middle" class="tag" fill="#10b981">Auth</text>
