    <rect class="card-border" width="300" height="300" rx="10" stroke="url(#dpink)" style="animation: borderGlow2 4s ease-in-out infinite; animation-delay: 1s;"/>
    <circle cx="22" cy="22" class="status-dot" fill="#ff0844" style="animation-delay: 0.5s;"/>
    <text x="34" y="26" fill="#ff0844" font-size="9" font-weight="700" letter-spacing="1">ACTIVE</text>
    <text x="150" y="70" text-anchor="middle" class="card-title">MOTION &amp; ANIMATION</text>
    <text x="150" y="140" text-anchor="middle" class="card-count" fill="#ff0844" style="animation-delay: 0.5s;">10</text>
    <text x="150" y="160" text-anchor="middle" class="card-label">SKILLS LOADED</text>
    <!-- Tags -->
    <rect x="20" y="185" width="100" height="20" class="tag-bg" fill="#ff0844"/>
    <text x="70" y="199" text-anchor="middle" class="tag" fill="#ff0844">GSAP Core</text>
    <rect x="128" y="185" width="90" height="20" class="tag-bg" fill="#ff0844"/>
    <text x="173" y="199" text-anchor="middle" class="tag" fill="#ff0844">ScrollTrig</text>
    <rect x="226" y="185" width="55" height="20" class="tag-bg" fill="#ff0844"/>
    <text x="253" y="199" text-anchor="middle" class="tag" fill="#ff0844">Flip</text>
    <rect x="20" y="213" width="80" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="60" y="227" text-anchor="middle" class="tag" fill="#ffb199">dotLottie</text>
    <rect x="108" y="213" width="85" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="150" y="227" text-anchor="middle" class="tag" fill="#ffb199">SplitText</text>
    <rect x="201" y="213" width="80" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="241" y="227" text-anchor="middle" class="tag" fill="#ffb199">MorphSVG</text>
    <rect x="20" y="241" width="95" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="67" y="255" text-anchor="middle" class="tag" fill="#ffb199">Generative</text>
    <rect x="123" y="241" width="85" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="165" y="255" text-anchor="middle" class="tag" fill="#ffb199">React/SSR</text>
    <rect x="216" y="241" width="65" height="20" class="tag-bg" fill="#ffb199"/>
    <text x="248" y="255" text-anchor="middle" class="tag" fill="#ffb199">Perf</text>
  </g>

  <!-- Card 3: Monetization -->
  <g transform="translate(680, 20)">
